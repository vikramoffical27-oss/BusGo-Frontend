<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>BusGo - Search Bus</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <div class="logo">
            🚌 BusGo
        </div>

        <ul class="nav-links">

            <li>
                <a href="searchbus.html">Search</a>
            </li>

            <li>
                <a href="buses.html">Buses</a>
            </li>

            <li>
                <a href="mybookings.html">My Bookings</a>
            </li>

        </ul>

    </nav>


    <!-- Search Section -->

    <div class="container">

        <h2>🚌 Search Bus</h2>


        <input
            type="text"
            id="source"
            placeholder="From"
        >

        <br><br>


        <input
            type="text"
            id="destination"
            placeholder="To"
        >

        <br><br>


        <label for="journeyDate">
            📅 Journey Date
        </label>

        <br><br>


        <input
            type="date"
            id="journeyDate"
        >

        <br><br>


        <button onclick="searchBus()">
            🔍 Search Buses
        </button>


        <!-- Search Results -->

        <div id="result"></div>

    </div>


    <script src="script.js"></script>

</body>

</html>
